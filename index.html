<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FixTrack - Registration</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="header-content">

            <!-- LOGO -->
            <a href="#" class="logo">

                <img src="logo.png" alt="FixTrack Logo">

                <span>FIXTRACK</span>

            </a>


            <!-- NAVIGATION -->
            <nav class="navigation">

                <a href="#">HOME</a>

                <a href="#">REPORT STATUS</a>

                <a href="#">ACCOUNT</a>

                <button class="report-button">
                    REPORT AN ISSUE
                </button>

            </nav>

        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="main">

        <!-- TITLE -->

        <h1 class="registration-title">
            Registration
        </h1>


        <!-- REGISTRATION BOX -->

        <div class="registration-box">

            <form id="registrationForm">


                <!-- STUDENT ID -->

                <div class="form-row">

                    <label for="studentId">
                        Student Id
                    </label>

                    <input
                        type="text"
                        id="studentId"
                        name="studentId">

                </div>


                <!-- FULL NAME -->

                <div class="form-row">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName">

                </div>


                <!-- EMAIL -->

                <div class="form-row">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email">

                </div>


                <!-- ADDRESS -->

                <div class="form-row">

                    <label for="address">
                        Address
                    </label>

                    <input
                        type="text"
                        id="address"
                        name="address">

                </div>


                <!-- USERNAME -->

                <div class="form-row">

                    <label for="username">
                        User Name
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username">

                </div>


                <!-- PASSWORD -->

                <div class="form-row">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password">

                        <button
                            type="button"
                            class="eye-button"
                            id="togglePassword">

                            <i class="bi bi-eye"></i>

                        </button>

                    </div>

                </div>


                <!-- REGISTER BUTTON -->

                <div class="register-container">

                    <button
                        type="submit"
                        class="register-button">

                        Register

                    </button>

                </div>


                <!-- MESSAGE -->

                <p id="message"></p>

            </form>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="footer-content">


            <!-- FOOTER LOGO -->

            <div class="footer-logo">

                <img src="logo.png" alt="FixTrack Logo">

                <strong>FIXTRACK</strong>

            </div>


            <!-- DESCRIPTION -->

            <div class="footer-description">

                <span>
                    Campus Maintenance Request and
                </span>

                <span>
                    Management System for
                </span>

                <span>
                    Philippine Christian University-Dasmariñas
                </span>

            </div>


            <!-- SOCIAL -->

            <div class="social">

                <span>
                    CONNECT WITH US!
                </span>

                <div class="social-icons">

                    <i class="bi bi-facebook"></i>

                    <i class="bi bi-instagram"></i>

                    <!-- TELEPHONE ICON -->
                    <i class="bi bi-telephone-fill"></i>

                </div>

            </div>


            <!-- FOOTER REPORT BUTTON -->

            <button class="footer-button">

                REPORT AN ISSUE

            </button>


        </div>

    </footer>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Custom JS -->

    <script src="script.js"></script>

</body>

</html>
