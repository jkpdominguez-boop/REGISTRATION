<!DOCTYPE html>
<html lang="en">

<head>

    <title>FixTrack - Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <div class="logo">
            <span class="logo-icon">🔧</span>
            <span class="logo-text">FIXTRACK</span>
        </div>

        <nav class="navbar">
            <a href="#">HOME</a>
            <a href="#">REPORT STATUS</a>
            <a href="#">ACCOUNT</a>

            <button class="nav-btn" type="button">
                REPORT AN ISSUE
            </button>
        </nav>

    </header>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="main-content">

        <h2>Registration</h2>

        <div class="registration-box">

            <form id="registrationForm">

                <!-- Student ID -->
                <div class="form-row">

                    <label for="studentId">
                        Student Id
                    </label>

                    <input type="text" id="studentId" name="studentId" autocomplete="off">

                </div>


                <!-- Full Name -->
                <div class="form-row">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input type="text" id="fullName" name="fullName" autocomplete="name">

                </div>


                <!-- Email -->
                <div class="form-row">

                    <label for="email">
                        Email
                    </label>

                    <input type="email" id="email" name="email" autocomplete="email">

                </div>


                <!-- Address -->
                <div class="form-row">

                    <label for="address">
                        Address
                    </label>

                    <input type="text" id="address" name="address" autocomplete="street-address">

                </div>


                <!-- Username -->
                <div class="form-row">

                    <label for="username">
                        User Name
                    </label>

                    <input type="text" id="username" name="username" autocomplete="username">

                </div>


                <!-- Password -->
                <div class="form-row password-row">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-container">

                        <input type="password" id="password" name="password" autocomplete="new-password">

                        <button type="button" id="togglePassword" class="toggle-password">
                            Show
                        </button>

                    </div>

                </div>


                <!-- Register Button -->
                <button type="submit" class="register-btn">
                    Register
                </button>


                <!-- Message -->
                <p id="message"></p>

            </form>

        </div>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="footer">

        <div class="footer-logo">
            <span class="footer-icon">🔧</span>
            <strong>FIXTRACK</strong>
        </div>


        <div class="footer-description">

            <span>
                Campus Maintenance Request and
            </span>

            <span>
                Management System for
            </span>

            <span>
                Philippine Christian University-Dasmariñas
            </span>

        </div>


        <div class="social">

            <span class="connect-text">
                CONNECT WITH US!
            </span>

            <div class="social-icons">
                <span>●</span>
                <span>●</span>
                <span>●</span>
            </div>

        </div>


        <button class="footer-btn" type="button">
            REPORT AN ISSUE
        </button>

    </footer>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
