<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FixTrack - Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <div class="logo">
            <img src="logo.png" alt="FixTrack Logo">
            <span>FIXTRACK</span>
        </div>

        <nav class="navbar">
            <a href="#">HOME</a>
            <a href="#">REPORT STATUS</a>
            <a href="#">ACCOUNT</a>

            <button class="nav-btn">
                REPORT AN ISSUE
            </button>
        </nav>

    </header>


    <!-- MAIN -->
    <main class="main-content">

        <h1>Registration</h1>

        <div class="registration-box">

            <form id="registrationForm">

                <!-- Student ID -->
                <div class="form-row">
                    <label for="studentId">Student Id</label>

                    <input
                        type="text"
                        id="studentId"
                        placeholder="Enter your student ID"
                    >
                </div>


                <!-- Full Name -->
                <div class="form-row">
                    <label for="fullName">Full Name</label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                    >
                </div>


                <!-- Email -->
                <div class="form-row">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email address"
                    >
                </div>


                <!-- Address -->
                <div class="form-row">
                    <label for="address">Address</label>

                    <input
                        type="text"
                        id="address"
                        placeholder="Enter your address"
                    >
                </div>


                <!-- Username -->
                <div class="form-row">
                    <label for="username">User Name</label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter your username"
                    >
                </div>


                <!-- Password -->
                <div class="form-row">

                    <label for="password">Password</label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                        >

                        <button
                            type="button"
                            id="togglePassword"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- Register -->
                <button
                    type="submit"
                    class="register-btn"
                >
                    Register
                </button>


                <p id="message"></p>

            </form>

        </div>

    </main>


    <!-- FOOTER -->
    <footer class="footer">

        <div class="footer-logo">

            <img src="logo.png" alt="FixTrack Logo">

            <strong>FIXTRACK</strong>

        </div>


        <div class="footer-description">

            <span>Campus Maintenance Request and</span>

            <span>Management System for</span>

            <span>Philippine Christian University-Dasmariñas</span>

        </div>


        <div class="social">

            <span>CONNECT WITH US!</span>

            <div class="social-icons">
                <span>●</span>
                <span>●</span>
                <span>●</span>
            </div>

        </div>


        <button class="footer-btn">
            REPORT AN ISSUE
        </button>

    </footer>


    <script src="script.js"></script>

</body>

</html>
